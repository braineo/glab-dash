[workspace]
members = ["crates/glab-core", "crates/glab-dash", "crates/glab-tui"]
resolver = "3"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow noisy pedantic lints that don't improve this codebase
too_many_lines = "allow"            # large match-based event handlers are idiomatic
items_after_statements = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"              # internal code, not a library
wildcard_imports = "allow"          # crate uses glob imports by convention
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"        # fires on every pub getter once this is a lib
implicit_hasher = "allow"           # internal API; callers all use the default hasher
should_implement_trait = "allow"    # `Field::from_str` etc. wrap the strum-derived
                                    # `FromStr` to return Option, not Result

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comrak = "0.52.0"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
fuzzy-matcher = "0.3"
glab-core = { path = "crates/glab-core" }
glab-tui = { path = "crates/glab-tui" }
open = "5"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["json"] }
rpassword = "7"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.26", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tui-textarea = "0.7"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true
